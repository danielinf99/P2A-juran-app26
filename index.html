<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>EduSupply Hub</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f1f5f9;
}

header {
    background: #2563eb;
    color: white;
    padding: 20px;
    text-align: center;
}

#produkty {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
}

.karta {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 5px 10px rgba(0,0,0,0.1);
}

button {
    background: #16a34a;
    color: white;
    border: none;
    padding: 10px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #15803d;
}

#objednavka {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <img src="logo.png" style="width:80px; display:block; margin:0 auto;">
  <h1>EduSupply Hub</h1>
  <p>Vše pro školu na jednom místě</p>
</header>

<div id="produkty"></div>

<div id="objednavka">
    <h2>🛒 Objednávka</h2>
    <p id="seznam">Zatím nic nevybráno</p>
    <p>Kusů: <span id="pocet">0</span></p>
    <p>Cena: <span id="cena">0</span> Kč</p>

    <h3>Kontaktní údaje</h3>
    <input id="jmeno" placeholder="Jméno"><br>
    <input id="prijmeni" placeholder="Příjmení"><br>
    <input id="email" type="email" placeholder="Email"><br>
    <input id="telefon" placeholder="Telefon"><br><br>

    <button onclick="odeslat()">ODESLAT OBJEDNÁVKU</button>
</div>

<script>

let objednavka = {};
let cena = 0;
let pocet = 0;

// ✅ načtení CSV
fetch("produkty.csv")
.then(res => res.text())
.then(data => {

    let radky = data.split("\n").slice(1);

    radky.forEach(radek => {

        if (!radek.trim()) return;

        let [nazev, cenaProdukt] = radek.split(";");
        if (!nazev || !cenaProdukt) return;

        cenaProdukt = parseFloat(cenaProdukt);

        let div = document.createElement("div");
        div.className = "karta";

        div.innerHTML = `
            <h3>${nazev}</h3>
            <p>${cenaProdukt} Kč</p>
            <button onclick="pridat('${nazev}', ${cenaProdukt})">Přidat</button>
        `;

        document.getElementById("produkty").appendChild(div);
    });
});

// ✅ přidání položky
function pridat(nazev, cenaProdukt) {

    if (!objednavka[nazev]) {
        objednavka[nazev] = 0;
    }

    objednavka[nazev]++;

    cena += cenaProdukt;
    pocet++;

    document.getElementById("cena").innerText = cena;
    document.getElementById("pocet").innerText = pocet;

    updateSeznam();
}

// ✅ seznam položek (např. 2x Sešit)
function updateSeznam() {

    let text = "";

    for (let item in objednavka) {
        text += `${objednavka[item]}x ${item}, `;
    }

    if (text === "") {
        text = "Zatím nic nevybráno";
    } else {
        text = text.slice(0, -2);
    }

    document.getElementById("seznam").innerText = text;
}

// ✅ ODESLÁNÍ MAILU (HLAVNÍ OPRAVA)
function odeslat() {

    let jmeno = document.getElementById("jmeno").value;
    let prijmeni = document.getElementById("prijmeni").value;
    let email = document.getElementById("email").value;
    let telefon = document.getElementById("telefon").value;

    if (!jmeno || !prijmeni || !email || !telefon) {
        alert("Vyplň vše!");
        return;
    }

    let seznam = "";

    for (let item in objednavka) {
        seznam += `${objednavka[item]}x ${item}\n`;
    }

    if (!seznam) {
        alert("Nevybral jsi žádné položky!");
        return;
    }

    let text = `OBJEDNÁVKA:

${seznam}

Celkem: ${cena} Kč
Počet kusů: ${pocet}

Zákazník:
${jmeno} ${prijmeni}
Email: ${email}
Telefon: ${telefon}`;

    // ✅ MAILTO
    let mail =
        "mailto:app@kostka-skola.cz" +
        "?subject=" + encodeURIComponent("Objednávka EduSupply") +
        "&body=" + encodeURIComponent(text);

    window.location.href = mail;
}

</script>

</body>
</html>
